<!-- Full mark: 32px and up. Ring = "rework it", tick = "and it is right".
     Regenerate with:
     for s in 32 48 128; do rsvg-convert -w $s -h $s mark-full.svg -o icon$s.png; done -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f95f5"/>
      <stop offset="1" stop-color="#1273d4"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <circle cx="64" cy="70" r="58" fill="#0b5fb0" fill-opacity="0.18"/>

  <!-- Open ring, gap between 12 and 3 o'clock, filled by the tick. -->
  <path d="M 105.9 72.2 A 42 42 0 1 1 77 30.1" fill="none"
        stroke="#ffffff" stroke-width="13" stroke-linecap="butt"/>

  <path d="M 84 44 L 95 56 L 115 26" fill="none" stroke="#3fca4f"
        stroke-width="15" stroke-linejoin="miter"/>

  <text x="64" y="90" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="bold"
        font-size="48" fill="#ffffff">S</text>
</svg>
