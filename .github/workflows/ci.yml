name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: lint
        run: uv run ruff check .
      - name: format
        run: uv run ruff format --check .
      - name: type check
        run: uv run mypy src
      - name: tests
        run: uv run pytest -q
      - name: architecture boundaries
        run: uv run lint-imports
